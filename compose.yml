services:
  frontend:
    build:
      context: ./control-plane/frontend
      dockerfile: Dockerfile
      args:
        NUXT_APP_BASE_URL: ${FRONTEND_BASE_URL:-/}
    environment:
      NUXT_APP_BASE_URL: ${FRONTEND_BASE_URL:-/}
    ports:
      - "${FRONTEND_BIND:-0.0.0.0}:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-honeypotforge}
      POSTGRES_USER: ${DB_USER:-honeypotforge}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-honeypotforge}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./control-plane/api
      dockerfile: dockerfile
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-honeypotforge}
      DB_USER: ${DB_USER:-honeypotforge}
      DB_PASSWORD: ${DB_PASSWORD:-honeypotforge}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must contain at least 32 characters}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      CORS_ORIGIN_REGEX: ${CORS_ORIGIN_REGEX:-}
      MTLS_DIR: /var/lib/honeypotforge/mtls
      SERVER_COMMON_NAME: ${SERVER_COMMON_NAME:-agent-gateway}
      SERVER_SAN: ${SERVER_SAN:-DNS:agent-gateway,DNS:api,DNS:localhost,IP:127.0.0.1,IP:10.0.2.2}
      AGENT_GATEWAY_TOKEN: ${AGENT_GATEWAY_TOKEN:?AGENT_GATEWAY_TOKEN must contain at least 32 characters}
      QEMU_IMAGE_DIR: /var/lib/honeypot-images
    ports:
      - "${API_BIND:-0.0.0.0}:${API_PORT:-8000}:8000"
    volumes:
      - mtls_data:/var/lib/honeypotforge/mtls
      - qemu_images:/var/lib/honeypot-images
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  agent-gateway:
    image: nginx:1.29-alpine
    environment:
      AGENT_GATEWAY_TOKEN: ${AGENT_GATEWAY_TOKEN:?AGENT_GATEWAY_TOKEN must contain at least 32 characters}
      NGINX_ENVSUBST_FILTER: AGENT_GATEWAY_TOKEN
    ports:
      - "${AGENT_GATEWAY_BIND:-0.0.0.0}:${AGENT_MTLS_PORT:-8443}:8443"
      - "${AGENT_GATEWAY_BIND:-0.0.0.0}:${CONTROL_HTTPS_PORT:-8444}:8444"
    volumes:
      - ./control-plane/agent-gateway/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - mtls_data:/etc/honeypotforge/mtls:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  qemu-agent:
    profiles: [qemu]
    build:
      context: ./agent
      dockerfile: dockerfile
      target: qemu-runtime
    network_mode: host
    environment:
      HONEYPOT_GATEWAY_URL: https://localhost:${AGENT_MTLS_PORT:-8443}
      HONEYPOT_WORKER_NAME: ${HONEYPOT_WORKER_NAME:-runtime-worker}
      HONEYPOT_ENROLLMENT_URL: https://localhost:${CONTROL_HTTPS_PORT:-8444}/agents/enroll
      HONEYPOT_ENROLLMENT_TOKEN: ${HONEYPOT_ENROLLMENT_TOKEN:-}
      HONEYPOT_BOOTSTRAP_CA: /etc/agent/ca.crt
      HONEYPOT_POLL_INTERVAL: ${HONEYPOT_POLL_INTERVAL:-5s}
      HONEYPOT_QEMU_IMAGE_DIR: /var/lib/honeypot-images
      HONEYPOT_QEMU_GATEWAY_URL: ${HONEYPOT_QEMU_GATEWAY_URL:-https://10.0.2.2:8443}
      HONEYPOT_QEMU_ENROLLMENT_URL: ${HONEYPOT_QEMU_ENROLLMENT_URL:-https://10.0.2.2:8444/agents/enroll}
    volumes:
      - qemu_agent_state:/var/lib/honeypot-agent
      - ${AGENT_BOOTSTRAP_CA:-./bootstrap-ca.crt}:/etc/agent/ca.crt:ro
      - qemu_images:/var/lib/honeypot-images:ro
    depends_on:
      agent-gateway:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  qemu_images:
  mtls_data:
  qemu_agent_state:
