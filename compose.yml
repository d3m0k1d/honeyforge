services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-honeypotforge}
      POSTGRES_USER: ${DB_USER:-honeypotforge}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-honeypotforge}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./control-plane/api
      dockerfile: dockerfile
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-honeypotforge}
      DB_USER: ${DB_USER:-honeypotforge}
      DB_PASSWORD: ${DB_PASSWORD:-honeypotforge}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must contain at least 32 characters}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
