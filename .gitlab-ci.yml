stages:
  - lint
  - test

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

variables:
  UV_CACHE_DIR: $CI_PROJECT_DIR/.cache/uv

default:
  image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim@sha256:e5b65587bce7de595f299855d7385fe7fca39b8a74baa261ba1b7147afa78e58
  cache:
    key:
      files:
        - control-plane/api/pyproject.toml
        - agent/pyproject.toml
    paths:
      - .cache/uv

python-lint:
  stage: lint
  script:
    - cd control-plane/api
    - uvx --from ruff==0.17.0 ruff check --config pyproject.toml src tests ../../agent/src
    - uvx --from ruff==0.17.0 ruff format --check --config pyproject.toml src tests ../../agent/src

python-tests:
  stage: test
  before_script:
    - cd control-plane/api
    - uv sync --dev
  script:
    - uv run pytest -q
